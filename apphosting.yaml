# Firebase App Hosting runtime configuration.
#
# Secret-valued entries resolve from Cloud Secret Manager at deploy time and
# are never stored in this file.
#
# A variable that has no real value yet is left out of this file entirely,
# rather than declared with `value: ""` — App Hosting's server-side schema
# rejects an empty string as invalid ("apphosting.yaml is not formatted
# properly"), and an omitted variable is simply `undefined` in
# `process.env`, which every field in lib/env.ts already treats as "this
# feature is not configured".

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2
  concurrency: 80

env:
  - variable: BACKUP_ENCRYPTION_KEY
    secret: backup-encryption-key
    availability:
      - RUNTIME

  - variable: BACKUP_KEY_VERSION
    value: v1
    availability:
      - RUNTIME

  # Set these two only while rotating the backup key, and keep them until
  # every active account has produced a snapshot under the new key.
  # - variable: BACKUP_PREVIOUS_ENCRYPTION_KEY
  #   secret: backup-previous-encryption-key
  #   availability:
  #     - RUNTIME
  # - variable: BACKUP_PREVIOUS_KEY_VERSION
  #   value: v0
  #   availability:
  #     - RUNTIME

  - variable: TRIAL_HASH_SECRET
    secret: trial-hash-secret
    availability:
      - RUNTIME

  # The reCAPTCHA Enterprise site key. This must be the exact key registered
  # against the `portfolio` web app in App Check — the "Portfolio" key, not
  # the later "portfolio-web" one. A token minted by any other key is rejected
  # with auth/firebase-app-check-token-is-invalid, which blocks sign-in
  # entirely once App Check is enforced on Authentication.
  #
  # Public by design: it is served to every browser by
  # /api/public/firebase-config, and authorisation still comes from
  # Authentication and the App Check token itself.
  - variable: FIREBASE_APPCHECK_SITE_KEY
    value: 6Lfvh6wtAAAAAOVTedKlVNtyMR1cWXA1h97_5zyU
    availability:
      - RUNTIME

  # Certificate scanning. Each read bills a Vertex AI call, so it is behind an
  # explicit switch rather than on by default. Authentication is the App
  # Hosting runtime's own identity — there is no API key.
  - variable: DOCUMENT_SCAN_ENABLED
    value: "true"
    availability:
      - RUNTIME

  # Flash is deliberate: reading printed fields off a document is not a
  # reasoning task, and thinking is disabled in the request for the same
  # reason. Raise this to a stronger model here if extraction accuracy proves
  # insufficient — nothing in the code assumes a particular model.
  - variable: DOCUMENT_SCAN_MODEL
    value: gemini-2.5-flash
    availability:
      - RUNTIME

  # Firestore is in Mumbai but App Hosting is in Singapore; "global" lets
  # Vertex route the request rather than pinning it to either.
  - variable: VERTEX_LOCATION
    value: global
    availability:
      - RUNTIME

  # Not yet configured — add back once a value exists:
  #   firebase apphosting:secrets:set razorpay-key-secret
  #   firebase apphosting:secrets:set razorpay-webhook-secret
  #
  # - variable: RAZORPAY_KEY_ID
  #   value: "<Razorpay key id>"
  #   availability:
  #     - RUNTIME
  # - variable: RAZORPAY_KEY_SECRET
  #   secret: razorpay-key-secret
  #   availability:
  #     - RUNTIME
  # - variable: RAZORPAY_WEBHOOK_SECRET
  #   secret: razorpay-webhook-secret
  #   availability:
  #     - RUNTIME
  # - variable: RAZORPAY_PLAN_MONTHLY
  #   value: "<Razorpay monthly plan id>"
  #   availability:
  #     - RUNTIME
  # - variable: RAZORPAY_PLAN_HALF_YEARLY
  #   value: "<Razorpay half-yearly plan id>"
  #   availability:
  #     - RUNTIME
